name: Update and deploy site

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pykakasi
      - name: Fetch soccer data (関東・関西・東北・北信越)
        run: python pipeline/fetch_all.py
      - name: Generate articles (節レビュー記事・1回の実行で最大2件)
        run: python pipeline/generate_articles.py
      - name: Generate site
        run: python pipeline/generate_site.py
      - name: Commit updated data & site
        if: github.event_name != 'push'
        run: |
          git config user.name "soccermania-bot"
          git config user.email "bot@piecetimes.jp"
          git add data content site
          git diff --cached --quiet || git commit -m "chore: auto-update soccer data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
