<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>オフサイドポジションの模式図。攻撃側は右向きに攻める。後ろから2人目の守備側の選手の位置の点線より相手ゴール側にいるAはオフサイドポジション、手前にいるBは違う</title>
<rect width="640" height="476" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker></defs><rect x="20" y="60" width="600" height="290" fill="#e8f3e8" stroke="#1f2a44" stroke-width="3"/><rect x="470" y="60" width="150" height="290" fill="#f2a900" fill-opacity="0.22"/><rect x="590" y="175" width="30" height="60" fill="none" stroke="#1f2a44" stroke-width="2"/><line x1="470" y1="52" x2="470" y2="358" stroke="#1f2a44" stroke-width="3" stroke-dasharray="9 6"/><text x="548" y="92" font-size="16" text-anchor="middle" fill="#8a6100" font-weight="bold" >ここが</text><text x="548" y="114" font-size="16" text-anchor="middle" fill="#8a6100" font-weight="bold" >オフサイド</text><text x="548" y="136" font-size="16" text-anchor="middle" fill="#8a6100" font-weight="bold" >ポジション</text><text x="20" y="30" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >ハーフウェーライン側</text><text x="620" y="30" font-size="15" text-anchor="end" fill="#1f2a44" font-weight="normal" >ゴールライン側</text><circle cx="585" cy="215" r="13" fill="#d64545" stroke="#ffffff" stroke-width="2"/><text x="585" y="220" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold" >GK</text><circle cx="480" cy="160" r="13" fill="#d64545" stroke="#ffffff" stroke-width="2"/><circle cx="385" cy="270" r="13" fill="#d64545" stroke="#ffffff" stroke-width="2"/><text x="585" y="245" font-size="14" text-anchor="middle" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1人目</text><text x="480" y="194" font-size="14" text-anchor="middle" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2人目</text><text x="385" y="304" font-size="14" text-anchor="middle" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3人目</text><circle cx="300" cy="255" r="13" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><circle cx="318" cy="262" r="6" fill="#ffffff" stroke="#1f2a44" stroke-width="2"/><circle cx="535" cy="310" r="13" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="535" y="340" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">A</text><circle cx="420" cy="110" r="13" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="420" y="92" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">B</text><line x1="326" y1="258" x2="512" y2="306" stroke="#1f2a44" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/><line x1="316" y1="244" x2="408" y2="122" stroke="#1f2a44" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah)"/><text x="300" y="290" font-size="14" text-anchor="middle" fill="#2f6fd6" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">パスを出す</text><circle cx="40" cy="383" r="9" fill="#2f6fd6"/><text x="56" y="389" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >攻撃側（右向きに攻める）</text><circle cx="300" cy="383" r="9" fill="#d64545"/><text x="316" y="389" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >守備側（数字はゴール側から）</text><text x="20" y="418" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >点線は、後ろから2人目の守備側の選手の位置。GKも1人に数える。</text><text x="20" y="440" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >パスが出た瞬間、Aは点線よりゴール側なのでオフサイドポジション。</text><text x="20" y="462" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >Bは点線より手前なので違う。反則になるのは、そのパスに関わったときだけ。</text>
</svg>
