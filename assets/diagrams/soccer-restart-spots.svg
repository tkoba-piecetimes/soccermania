<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>スローイン、ゴールキック、コーナーキックを行う場所の模式図。1はタッチライン上のボールが出た地点、2は左のゴールエリア内、3は左上のコーナー</title>
<rect width="640" height="490" fill="#ffffff"/>
<rect x="70" y="50" width="500" height="280" fill="#e8f3e8" stroke="#1f2a44" stroke-width="3"/><line x1="320.0" y1="50" x2="320.0" y2="330" stroke="#1f2a44" stroke-width="3"/><circle cx="320.0" cy="190.0" r="43.6" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="70.0" y="107.0" width="78.6" height="166.0" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="70.0" y="152.3" width="26.2" height="75.4" fill="#f2a900" fill-opacity="0.45" stroke="#1f2a44" stroke-width="3"/><rect x="491.4" y="107.0" width="78.6" height="166.0" fill="none" stroke="#1f2a44" stroke-width="3"/><rect x="543.8" y="152.3" width="26.2" height="75.4" fill="#f2a900" fill-opacity="0.0" stroke="#1f2a44" stroke-width="3"/><circle cx="400" cy="50" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="400" y="56" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >1</text><circle cx="83.0952380952381" cy="190.0" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="83.0952380952381" y="196.0" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >2</text><circle cx="70" cy="50" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="70" y="56" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >3</text><path d="M70,58 A8,8 0 0 0 78,50" fill="none" stroke="#1f2a44" stroke-width="2"/><text x="400" y="88" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ボールが出た地点</text><text x="156" y="247.0" font-size="1" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"></text><text x="78" y="84" font-size="1" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke"></text><circle cx="32" cy="362" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="32" y="368" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >1</text><text x="58" y="368" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >スローイン：タッチラインを越えたとき。最後に触れなかった側が投げ入れる</text><circle cx="32" cy="394" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="32" y="400" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >2</text><text x="58" y="400" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >ゴールキック：攻撃側が最後に触れてゴールラインを越えたとき。守備側が蹴る</text><circle cx="32" cy="426" r="16" fill="#2f6fd6" stroke="#ffffff" stroke-width="2.5"/><text x="32" y="432" font-size="17" text-anchor="middle" fill="#ffffff" font-weight="bold" >3</text><text x="58" y="432" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >コーナーキック：守備側が最後に触れてゴールラインを越えたとき。攻撃側が蹴る</text><text x="20" y="466" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal" >※ゴールライン越えは、ゴールが入らなかった場合。図は左側のゴールを守る場合の例。</text>
</svg>
