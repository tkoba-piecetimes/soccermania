<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>関東大学サッカーリーグの昇格・降格の仕組み。1部と2部と3部の間は下位2チームと上位2チームが自動で入れ替わり、境目の順位は参入プレーオフ（入替戦）で決まる</title>
<rect width="640" height="560" fill="#ffffff"/>
<defs><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker></defs><rect x="30" y="30" width="200" height="56" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2.5"/><text x="130" y="57" font-size="19" text-anchor="middle" fill="#1f2a44" font-weight="bold" >1部</text><text x="130" y="77" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="normal" >各12大学</text><rect x="30" y="170" width="200" height="56" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2.5"/><text x="130" y="197" font-size="19" text-anchor="middle" fill="#1f2a44" font-weight="bold" >2部</text><text x="130" y="217" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="normal" >各12大学</text><rect x="30" y="310" width="200" height="56" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2.5"/><text x="130" y="337" font-size="19" text-anchor="middle" fill="#1f2a44" font-weight="bold" >3部</text><text x="130" y="357" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="normal" >各12大学</text><rect x="30" y="450" width="200" height="56" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2.5"/><text x="130" y="477" font-size="19" text-anchor="middle" fill="#1f2a44" font-weight="bold" >都県リーグ</text><text x="130" y="497" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="normal" >各都県のリーグ</text><line x1="116" y1="164" x2="116" y2="92" stroke="#2f6fd6" stroke-width="3.5" marker-end="url(#ahb)"/><line x1="144" y1="92" x2="144" y2="164" stroke="#d64545" stroke-width="3.5" marker-end="url(#ahr)"/><line x1="116" y1="304" x2="116" y2="232" stroke="#2f6fd6" stroke-width="3.5" marker-end="url(#ahb)"/><line x1="144" y1="232" x2="144" y2="304" stroke="#d64545" stroke-width="3.5" marker-end="url(#ahr)"/><line x1="116" y1="444" x2="116" y2="372" stroke="#2f6fd6" stroke-width="3.5" marker-end="url(#ahb)"/><line x1="144" y1="372" x2="144" y2="444" stroke="#d64545" stroke-width="3.5" marker-end="url(#ahr)"/><text x="260" y="480" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >青の矢印＝昇格　赤の矢印＝降格</text><text x="260" y="104" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="bold" >自動で入れ替え</text><text x="260" y="124" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >1部の11・12位 ↓ 2部へ</text><text x="260" y="144" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >2部の1・2位 ↑ 1部へ</text><text x="260" y="164" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >プレーオフ：1部10位 対 2部3位</text><text x="260" y="244" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="bold" >自動で入れ替え</text><text x="260" y="264" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >2部の11・12位 ↓ 3部へ</text><text x="260" y="284" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >3部の上位2チーム ↑ 2部へ</text><text x="260" y="304" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >プレーオフ：2部9位 対 3部4位、</text><text x="260" y="324" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >　　　　　　2部10位 対 3部3位</text><text x="260" y="384" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >3部12位 ⇔ 関東大学サッカー大会の優勝</text><text x="260" y="404" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >3部10・11位は、同大会の上位と</text><text x="260" y="424" font-size="15" text-anchor="start" fill="#1f2a44" font-weight="normal" >プレーオフ</text><text x="20" y="545" font-size="14" text-anchor="start" fill="#1f2a44" font-weight="normal" >JUFA関東「大学サッカー基礎知識」の記載にもとづく例。年度ごとの要項で確認を。</text>
</svg>
