<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>サッカーのポジション名と位置の例（4-2-3-1）。後ろからゴールキーパー、サイドバックとセンターバック、ボランチ、サイドハーフとトップ下、フォワード</title>
<rect width="640" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a44"/></marker></defs><rect x="20" y="30" width="600" height="340" fill="#e8f3e8" stroke="#1f2a44" stroke-width="3"/><line x1="320.0" y1="30" x2="320.0" y2="370" stroke="#1f2a44" stroke-width="2" stroke-opacity="0.5"/><circle cx="320.0" cy="200.0" r="40" fill="none" stroke="#1f2a44" stroke-width="2" stroke-opacity="0.5"/><rect x="20" y="120.0" width="70" height="160" fill="none" stroke="#1f2a44" stroke-width="2" stroke-opacity="0.5"/><rect x="550" y="120.0" width="70" height="160" fill="none" stroke="#1f2a44" stroke-width="2" stroke-opacity="0.5"/><circle cx="80" cy="200" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="80" y="232" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ゴールキーパー</text><circle cx="190" cy="75" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="190" y="107" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">サイドバック</text><circle cx="190" cy="165" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="190" y="197" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">センターバック</text><circle cx="190" cy="235" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="190" y="267" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">センターバック</text><circle cx="190" cy="325" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="190" y="357" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">サイドバック</text><circle cx="300" cy="160" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="300" y="192" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ボランチ</text><circle cx="300" cy="240" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="300" y="272" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ボランチ</text><circle cx="410" cy="70" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="410" y="102" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">サイドハーフ</text><circle cx="410" cy="200" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="410" y="232" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">トップ下</text><circle cx="410" cy="330" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="410" y="362" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">サイドハーフ</text><circle cx="525" cy="200" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="2"/><text x="525" y="232" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">フォワード</text><line x1="250" y1="20" x2="470" y2="20" stroke="#1f2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="210" y="26" font-size="15" text-anchor="end" fill="#1f2a44" font-weight="normal" >攻める向き</text><rect x="40" y="392" width="80" height="30" rx="6" fill="#2f6fd6" fill-opacity="0.14" stroke="#2f6fd6" stroke-width="1.5"/><text x="80.0" y="413" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" >GK</text><rect x="150" y="392" width="80" height="30" rx="6" fill="#2f6fd6" fill-opacity="0.14" stroke="#2f6fd6" stroke-width="1.5"/><text x="190.0" y="413" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" >DF（守備）</text><rect x="260" y="392" width="195" height="30" rx="6" fill="#2f6fd6" fill-opacity="0.14" stroke="#2f6fd6" stroke-width="1.5"/><text x="357.5" y="413" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" >MF（中盤）</text><rect x="485" y="392" width="80" height="30" rx="6" fill="#2f6fd6" fill-opacity="0.14" stroke="#2f6fd6" stroke-width="1.5"/><text x="525.0" y="413" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="bold" >FW（攻撃）</text><text x="320" y="452" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="normal" >例：4-2-3-1（GKを除き、守備4人・中盤2人と3人・攻撃1人）</text>
